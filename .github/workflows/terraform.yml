name: Terraform CI/CD

on:
  push:
    branches:
      - main
    paths:
      - "infra/**"
      - "backend/**"
      - ".github/workflows/terraform.yml"
  # Roda a CI também nos Pull Requests para a main. Sem credenciais AWS o plan falha,
  # mas o backend-check (testes) mostra o resultado antes.
  pull_request:
    branches:
      - main
    paths:
      - "infra/**"
      - "backend/**"
      - ".github/workflows/terraform.yml"
  workflow_dispatch:
    inputs:
      action:
        description: "Ação a executar"
        required: true
        default: "plan"
        type: choice
        options:
          - plan
          - apply
          - plan-destroy
          - destroy

# id-token: write é o que permite trocar o token OIDC do GitHub por
# credenciais temporárias da AWS (role criada no boot-strap/).
permissions:
  contents: read
  id-token: write

# Um único ambiente/state: nunca dois jobs mexendo na infra ao mesmo tempo.
# Não cancela execuções em andamento — interromper um apply pode corromper o state.
concurrency:
  group: terraform-dev
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TERRAFORM_VERSION: "1.16.0"
  # Opcional: e-mail dos alarmes do CloudWatch (módulo observability). Vazio = sem assinatura.
  TF_VAR_alarm_email: ${{ secrets.ALARM_EMAIL }}

defaults:
  run:
    working-directory: infra

jobs:
  # -------------------------------------------------------
  # Backend — verificação do código da Lambda (sem AWS)
  # -------------------------------------------------------
  backend-check:
    name: Backend (testes)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'pull_request' || github.event.inputs.action == 'plan' || github.event.inputs.action == 'apply'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13" # mesmo runtime da Lambda
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Instalar dependências de teste
        working-directory: .
        run: pip install -r backend/requirements-dev.txt

      - name: Compilar handler
        working-directory: .
        run: python -m py_compile backend/contador/handler.py

      - name: Testes unitários (cobertura mínima de 80%)
        working-directory: .
        run: pytest backend/tests --cov=backend/contador --cov-report=term-missing --cov-fail-under=80

  # -------------------------------------------------------
  # Plan — roda em todo push na main e quando action=plan
  # Valida o código e mostra o que será alterado
  # -------------------------------------------------------
  plan:
    name: Init + Validate + Plan
    runs-on: ubuntu-latest
    needs: backend-check
    if: github.event_name == 'push' || github.event_name == 'pull_request' || github.event.inputs.action == 'plan'

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v5.1.1
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3.1.2
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Terraform Format (infra + boot-strap)
        working-directory: .
        run: terraform fmt -check -recursive

      - name: Terraform Init
        run: terraform init -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan

  # -------------------------------------------------------
  # Apply — manual (action=apply), só a partir da main,
  # no GitHub Environment "dev" (aprovação opcional)
  # -------------------------------------------------------
  apply:
    name: Plan + Apply
    runs-on: ubuntu-latest
    needs: backend-check
    if: github.event.inputs.action == 'apply' && github.ref == 'refs/heads/main'
    environment: dev

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v5.1.1
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3.1.2
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Terraform Init
        run: terraform init -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"

      # Aplica exatamente o plano exibido no log, e não um novo cálculo.
      - name: Terraform Plan
        run: terraform plan -out=tfplan

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan

      - name: Publicar o site no S3
        run: |
          set -euo pipefail
          API=$(terraform output -raw count_endpoint)
          BUCKET=$(terraform output -raw frontend_bucket_name)
          printf 'window.CONTADOR_API_URL = "%s";\n' "$API" > ../frontend/config.js
          # no-cache: o config.js muda com a URL da API e não pode ficar preso no cache do navegador
          aws s3 sync ../frontend "s3://$BUCKET" --delete --cache-control "no-cache" --exclude "*.md" --exclude "config.example.js"
          echo "Site: $(terraform output -raw website_url)" >> "$GITHUB_STEP_SUMMARY"

      - name: Resumo do deploy
        run: |
          {
            echo "### Contador de Acessos — deploy concluído"
            echo ""
            echo "| Output | Valor |"
            echo "|---|---|"
            echo "| count_endpoint | \`$(terraform output -raw count_endpoint)\` |"
            echo "| lambda_function_name | \`$(terraform output -raw lambda_function_name)\` |"
            echo "| lambda_log_group_name | \`$(terraform output -raw lambda_log_group_name)\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  # -------------------------------------------------------
  # Plan Destroy — mostra o que será destruído sem executar
  # -------------------------------------------------------
  plan-destroy:
    name: Plan Destroy
    runs-on: ubuntu-latest
    if: github.event.inputs.action == 'plan-destroy'

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v5.1.1
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3.1.2
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Terraform Init
        run: terraform init -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"

      - name: Terraform Plan Destroy
        run: terraform plan -destroy

  # -------------------------------------------------------
  # Destroy — destrói toda a infra (manual, só a partir da main)
  # -------------------------------------------------------
  destroy:
    name: Destroy
    runs-on: ubuntu-latest
    if: github.event.inputs.action == 'destroy' && github.ref == 'refs/heads/main'
    environment: dev

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v5.1.1
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3.1.2
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Terraform Init
        run: terraform init -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"

      - name: Terraform Destroy
        run: terraform destroy -auto-approve
